<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xpotfy - Spotify Playlist Cloner</title>
    <style>
        :root {
            --primary: #1DB954;
            --primary-hover: #1ed760;
            --bg-dark: #121212;
            --bg-card: rgba(255, 255, 255, 0.05);
            --text-main: #FFFFFF;
            --text-muted: #B3B3B3;
            --glass-border: rgba(255, 255, 255, 0.1);
            --error: #e91429;
            --success: #1db954;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .background-glow {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(29, 185, 84, 0.15) 0%, rgba(18, 18, 18, 0) 70%);
            z-index: -1;
            filter: blur(80px);
            pointer-events: none;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        .hero {
            text-align: center;
            margin-bottom: 4rem;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            color: var(--primary);
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -2px;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            background: linear-gradient(to bottom, #fff 0%, #aaa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 2.5rem;
        }

        .glass {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .search-box {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
        }

        .btn {
            border: none;
            border-radius: 50px;
            padding: 0.8rem 2rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary {
            background-color: var(--primary);
            color: black;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(29, 185, 84, 0.3);
        }

        .btn-success {
            background-color: var(--success);
            color: black;
        }

        .btn-large {
            padding: 1.2rem 3rem;
            font-size: 1.1rem;
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
        }

        .btn-ghost:hover {
            color: white;
            border-color: white;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .playlist-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 1rem;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid transparent;
        }

        .playlist-card:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--glass-border);
            transform: translateY(-5px);
        }

        .playlist-card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .playlist-card h4 {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.2rem;
        }

        .playlist-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .hidden {
            display: none !important;
        }

        #preview-section {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .playlist-info {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        #preview-img {
            width: 180px;
            height: 180px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .playlist-meta h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .playlist-meta p {
            color: var(--text-muted);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: flex-end;
            border-top: 1px solid var(--glass-border);
            padding-top: 2rem;
        }

        .input-group {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-group label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
            cursor: pointer;
            height: 50px;
        }

        #status-section {
            text-align: center;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid var(--glass-border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin-top: 2rem;
            overflow: hidden;
        }

        #progress-fill {
            width: 0%;
            height: 100%;
            background: var(--primary);
            transition: 0.5s;
            box-shadow: 0 0 10px var(--primary);
        }

        #success-section {
            text-align: center;
        }

        .success-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .playlist-info { flex-direction: column; text-align: center; }
            .actions { flex-direction: column; align-items: stretch; }
            .input-group { min-width: 100%; }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-glow"></div>
    
    <main class="container">
        <header class="hero">
            <div class="logo">
                <svg viewBox="0 0 24 24" width="48" height="48" fill="currentColor">
                    <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.646 14.413c-.19.31-.592.404-.903.214-2.42-1.478-5.466-1.812-9.052-1.002-.353.08-.702-.14-.783-.493-.08-.352.14-.702.493-.783 3.928-.888 7.308-.507 10.03 1.16.312.19.405.592.215.904zm1.238-2.736c-.238.388-.748.512-1.136.273-2.77-1.702-6.993-2.19-10.274-1.202-.44.13-.894-.12-1.024-.56-.13-.44.12-.894.56-1.024 3.754-1.144 8.417-.596 11.6 1.36.388.237.512.748.274 1.137zm.11-2.846c-3.318-1.97-8.778-2.155-11.937-1.198-.51.155-1.05-.138-1.204-.648-.155-.51.138-1.05.648-1.204 3.633-1.103 9.65-.89 13.483 1.39.46.273.61.875.337 1.334-.274.46-.876.61-1.335.337z"/>
                </svg>
                <span>Xpotfy</span>
            </div>
            <h1>Clone qualquer playlist do Spotify instantaneamente</h1>
            <p>Transforme suas playlists favoritas em suas próprias coleções com um clique.</p>
            
            <div id="auth-section">
                <button id="login-btn" class="btn btn-primary btn-large">
                    Conectar com Spotify
                </button>
            </div>
        </header>

        <section id="app-section" class="hidden">
            <div class="search-box glass" style="margin-bottom: 1rem;">
                <input type="text" id="manual-token" placeholder="Token Spotify (opcional - para testes)">
                <button id="use-token-btn" class="btn btn-ghost">Usar Token</button>
            </div>

            <div class="search-box glass">
                <input type="text" id="playlist-query" placeholder="Cole o link da playlist ou busque por nome...">
                <button id="search-btn" class="btn btn-primary">Buscar</button>
            </div>

            <div class="search-box glass">
                <input type="text" id="composer-query" placeholder="Buscar músicas por compositor (ex: Zezé Di Camargo)">
                <button id="composer-search-btn" class="btn btn-primary">Buscar por Compositor</button>
            </div>

            <div id="composer-actions" class="hidden glass" style="margin-bottom: 2rem; padding: 1.5rem;">
                <div class="input-group">
                    <label for="composer-playlist-name">Nome da Playlist</label>
                    <input type="text" id="composer-playlist-name" placeholder="Ex: Zezé Di Camargo - Melhores Músicas">
                </div>
                <button id="create-composer-playlist-btn" class="btn btn-success btn-large">Criar Playlist</button>
            </div>

            <div id="results" class="results-grid"></div>

            <div id="preview-section" class="hidden glass">
                <div class="playlist-info">
                    <img id="preview-img" src="" alt="Capa">
                    <div class="playlist-meta">
                        <h2 id="preview-name">Nome da Playlist</h2>
                        <p id="preview-owner">De: <span></span></p>
                        <p id="preview-tracks"><span>0</span> músicas</p>
                    </div>
                </div>
                
                <div class="actions">
                    <div class="input-group">
                        <label for="clone-name">Nome da Nova Playlist</label>
                        <input type="text" id="clone-name" placeholder="Ex: Minha Cópia Favorita">
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="deduplicate" checked>
                        <label for="deduplicate">Remover duplicatas</label>
                    </div>
                    <button id="clone-btn" class="btn btn-success btn-large">Começar Clonagem</button>
                </div>
            </div>
        </section>

        <section id="status-section" class="hidden glass">
            <div class="loader"></div>
            <h3 id="status-msg">Clonando a playlist...</h3>
            <div class="progress-bar">
                <div id="progress-fill"></div>
            </div>
        </section>

        <section id="success-section" class="hidden glass">
            <div class="success-icon">✨</div>
            <h2>Playlist Criada com Sucesso!</h2>
            <p>Eles disseram que não era possível, mas aqui está.</p>
            <a id="playlist-link" href="#" target="_blank" class="btn btn-primary">Abrir no Spotify</a>
            <button id="reset-btn" class="btn btn-ghost">Clonar Outra</button>
        </section>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
