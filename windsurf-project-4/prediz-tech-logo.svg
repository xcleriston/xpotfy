<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Deep charcoal dark background -->
  <rect width="200" height="200" fill="#0A0F1A"/>
  
  <!-- Define gradients -->
  <defs>
    <!-- Electric purple to neon violet gradient -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A020F0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B00FF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Soft glow for background -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background glow circle -->
  <circle cx="100" cy="100" r="70" fill="url(#mainGradient)" opacity="0.1" filter="url(#softGlow)"/>
  
  <!-- Main stylized letter P with upward arrow -->
  <g transform="translate(100, 100)">
    <!-- Circuit board lines - background layer -->
    <g stroke="url(#mainGradient)" stroke-width="1" fill="none" opacity="0.6">
      <!-- Horizontal circuit lines -->
      <line x1="-40" y1="-30" x2="-20" y2="-30"/>
      <line x1="-20" y1="-30" x2="-20" y2="-10"/>
      <line x1="-20" y1="-10" x2="0" y2="-10"/>
      
      <line x1="-40" y1="0" x2="-20" y2="0"/>
      <line x1="-20" y1="0" x2="-20" y2="20"/>
      <line x1="-20" y1="20" x2="10" y2="20"/>
      
      <line x1="10" y1="-10" x2="30" y2="-10"/>
      <line x1="30" y1="-10" x2="30" y2="10"/>
      <line x1="30" y1="10" x2="10" y2="10"/>
      
      <!-- Vertical circuit lines -->
      <line x1="-40" y1="-30" x2="-40" y2="-10"/>
      <line x1="-40" y1="0" x2="-40" y2="20"/>
      <line x1="10" y1="-10" x2="10" y2="10"/>
      
      <!-- Diagonal circuit lines -->
      <line x1="-20" y1="-10" x2="-10" y2="0"/>
      <line x1="0" y1="20" x2="10" y2="10"/>
    </g>
    
    <!-- Data points -->
    <g fill="url(#mainGradient)">
      <circle cx="-40" cy="-30" r="2"/>
      <circle cx="-20" cy="-30" r="2"/>
      <circle cx="-20" cy="-10" r="2"/>
      <circle cx="0" cy="-10" r="2"/>
      <circle cx="-40" cy="0" r="2"/>
      <circle cx="-20" cy="0" r="2"/>
      <circle cx="-20" cy="20" r="2"/>
      <circle cx="10" cy="20" r="2"/>
      <circle cx="10" cy="-10" r="2"/>
      <circle cx="30" cy="-10" r="2"/>
      <circle cx="30" cy="10" r="2"/>
      <circle cx="10" cy="10" r="2"/>
      <circle cx="-40" cy="20" r="2"/>
    </g>
    
    <!-- Main letter P with upward arrow -->
    <g stroke="url(#mainGradient)" stroke-width="3" fill="none" filter="url(#neonGlow)">
      <!-- Vertical stem of P -->
      <line x1="-30" y1="-40" x2="-30" y2="40"/>
      
      <!-- Top curve of P -->
      <path d="M -30,-40 Q 10,-40 10,-10 Q 10,10 -30,10"/>
      
      <!-- Upward arrow integrated -->
      <path d="M 10,-10 L 20,-25 L 15,-20 M 10,-10 L 5,-5"/>
    </g>
    
    <!-- Additional tech elements -->
    <g stroke="url(#mainGradient)" stroke-width="1" fill="none" opacity="0.4">
      <!-- Small circuit details -->
      <rect x="-35" y="-35" width="10" height="10" rx="1"/>
      <rect x="15" y="-15" width="10" height="10" rx="1"/>
      <rect x="-35" y="15" width="10" height="10" rx="1"/>
      
      <!-- Connection dots -->
      <circle cx="-25" cy="-25" r="1"/>
      <circle cx="20" cy="-20" r="1"/>
      <circle cx="-25" cy="25" r="1"/>
    </g>
  </g>
  
  <!-- Brand text (optional - can be removed for icon-only) -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="12" font-weight="bold" 
        text-anchor="middle" fill="url(#mainGradient)" filter="url(#neonGlow)">
    prediz.tech
  </text>
</svg>
